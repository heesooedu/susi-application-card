<script>
  (function() {
    'use strict';

    // Apps Script HTML Service iframe의 location이 아니라 doGet(e)가 검증한 원본 token을 사용한다.
    const token = String(window.APP_INITIAL_TOKEN || '');
    const notice = document.getElementById('notice');
    const dashboard = document.getElementById('dashboard');
    const list = document.getElementById('application-list');
    const emptyState = document.getElementById('empty-state');
    const formSection = document.getElementById('application-form-section');
    const form = document.getElementById('application-form');
    const saveButton = document.getElementById('save-button');
    const formTitle = document.getElementById('form-title');
    const formKicker = document.getElementById('form-kicker');
    const resultEntrySection = form.querySelector('.result-entry-section');
    const applicationFields = [
      'university', 'department', 'admission_type', 'admission_name', 'quota',
      'csat_minimum', 'csat_minimum_details', 'evaluation_elements',
      'interview_details', 'official_url', 'source_reference', 'support_level',
      'support_reason', 'strengths', 'concerns', 'questions',
      'result_1_year', 'result_1_cut_50', 'result_1_cut_70', 'result_1_notes',
      'result_1_url', 'result_2_year', 'result_2_cut_50', 'result_2_cut_70',
      'result_2_notes', 'result_2_url', 'result_3_year', 'result_3_cut_50',
      'result_3_cut_70', 'result_3_notes', 'result_3_url'
    ];
    let editingApplicationId = '';

    document.getElementById('open-form-button').addEventListener('click', function() { openForm(null); });
    document.getElementById('close-form-button').addEventListener('click', closeForm);
    document.getElementById('cancel-form-button').addEventListener('click', closeForm);
    form.addEventListener('submit', saveApplication);
    form.addEventListener('change', function(event) {
      if (event.target.name === 'csat_minimum') updateMinimumDetails();
    });

    if (!/^[a-f0-9]{64}$/i.test(token)) {
      showNotice('학생 주소가 올바르지 않습니다. 선생님께 받은 주소 전체를 다시 확인해 주세요.', true);
      document.getElementById('student-summary').textContent = '접근할 수 없습니다.';
      return;
    }
    loadDashboard();

    function loadDashboard(successMessage) {
      showNotice('지원 카드를 불러오는 중입니다.', false);
      google.script.run
        .withSuccessHandler(function(data) {
          if (successMessage) showNotice(successMessage, false);
          else hideNotice();
          document.getElementById('student-summary').textContent =
            data.student.className + ' · ' + data.student.number + '번 · ' + data.student.name;
          dashboard.hidden = false;
          renderApplications(data.applications || []);
        })
        .withFailureHandler(handleFailure)
        .getStudentDashboard(token);
    }

    function saveApplication(event) {
      event.preventDefault();
      if (!form.reportValidity()) return;
      const payload = {};
      new FormData(form).forEach(function(value, key) { payload[key] = value; });
      const applicationId = editingApplicationId;
      saveButton.disabled = true;
      saveButton.textContent = '저장 중…';

      const request = google.script.run
        .withSuccessHandler(function() {
          closeForm();
          saveButton.disabled = false;
          saveButton.textContent = '카드 저장';
          loadDashboard(applicationId ? '지원 카드가 수정되었습니다.' : '지원 카드가 저장되었습니다.');
        })
        .withFailureHandler(function(error) {
          saveButton.disabled = false;
          saveButton.textContent = applicationId ? '수정 내용 저장' : '카드 저장';
          handleFailure(error);
        });

      if (applicationId) request.updateApplication(token, applicationId, payload);
      else request.createApplication(token, payload);
    }

    function renderApplications(applications) {
      list.replaceChildren();
      emptyState.hidden = applications.length !== 0;
      applications.forEach(function(application) {
        const card = document.createElement('article');
        card.className = 'application-card';

        const top = document.createElement('div');
        top.className = 'card-top';
        const titleWrap = document.createElement('div');
        const university = document.createElement('div');
        university.className = 'university';
        university.textContent = application.university;
        const department = document.createElement('div');
        department.className = 'department';
        department.textContent = application.department;
        const level = document.createElement('span');
        level.className = 'level-pill';
        level.textContent = application.support_level;
        titleWrap.append(university, department);
        top.append(titleWrap, level);
        card.appendChild(top);

        const admission = document.createElement('p');
        admission.className = 'admission-line';
        admission.textContent = application.admission_type + ' · ' + application.admission_name;
        card.appendChild(admission);

        const details = document.createElement('details');
        details.className = 'application-details';
        const summary = document.createElement('summary');
        summary.textContent = '전체 내용 펼쳐보기';
        details.appendChild(summary);
        addDetail(details, '전형 유형', application.admission_type);
        addDetail(details, '전형명', application.admission_name);
        addDetail(details, '모집인원', application.quota);
        addDetail(details, '수능최저', application.csat_minimum);
        addDetail(details, '수능최저 세부내용', application.csat_minimum_details);
        addDetail(details, '평가요소', application.evaluation_elements);
        addDetail(details, '면접 여부 및 방식', application.interview_details);
        addDetail(details, '자료 기준', application.source_reference);
        addAdmissionResult(details, application, 1);
        addAdmissionResult(details, application, 2);
        addAdmissionResult(details, application, 3);
        addDetail(details, '지원 수준', application.support_level);
        addDetail(details, '지원 이유', application.support_reason);
        addDetail(details, '본인이 생각하는 강점', application.strengths);
        addDetail(details, '우려되는 점', application.concerns);
        addDetail(details, '선생님께 질문하고 싶은 내용', application.questions);

        if (application.official_url) {
          const link = document.createElement('a');
          link.className = 'source-link';
          link.href = application.official_url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = '공식자료 보기 ↗';
          details.appendChild(link);
        }
        card.appendChild(details);

        const actions = document.createElement('div');
        actions.className = 'card-actions';
        const editButton = document.createElement('button');
        editButton.type = 'button';
        editButton.className = 'button button-ghost button-small';
        editButton.textContent = '수정';
        editButton.addEventListener('click', function() { openForm(application); });
        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'button button-danger button-small';
        deleteButton.textContent = '삭제';
        deleteButton.addEventListener('click', function() {
          deleteApplicationFromCard(application, deleteButton);
        });
        actions.append(editButton, deleteButton);
        card.appendChild(actions);
        list.appendChild(card);
      });
    }

    function addDetail(card, label, value) {
      if (!value) return;
      const detail = document.createElement('p');
      detail.className = 'card-detail';
      const strong = document.createElement('strong');
      strong.textContent = label + '  ';
      detail.append(strong, document.createTextNode(value));
      card.appendChild(detail);
    }

    function addAdmissionResult(container, application, index) {
      const prefix = 'result_' + index + '_';
      const year = application[prefix + 'year'];
      const cut50 = application[prefix + 'cut_50'];
      const cut70 = application[prefix + 'cut_70'];
      const notes = application[prefix + 'notes'];
      const url = application[prefix + 'url'];
      if (!year && !cut50 && !cut70 && !notes && !url) return;

      const heading = document.createElement('h4');
      heading.className = 'result-detail-heading';
      heading.textContent = year || '직전 ' + index + '개년 입시결과';
      container.appendChild(heading);
      addDetail(container, '50% 컷', cut50);
      addDetail(container, '70% 컷', cut70);
      addDetail(container, '기타 메모', notes);
      if (url) {
        const link = document.createElement('a');
        link.className = 'source-link result-source-link';
        link.href = url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = (year || '직전 ' + index + '개년') + ' 입시결과 보기 ↗';
        container.appendChild(link);
      }
    }

    function openForm(application) {
      form.reset();
      editingApplicationId = application ? application.id : '';
      if (application) {
        applicationFields.forEach(function(field) {
          if (form.elements[field]) form.elements[field].value = application[field] || '';
        });
        formKicker.textContent = 'EDIT CARD';
        formTitle.textContent = '지원 카드 수정';
        saveButton.textContent = '수정 내용 저장';
        resultEntrySection.open = [1, 2, 3].some(function(index) {
          const prefix = 'result_' + index + '_';
          return application[prefix + 'year'] || application[prefix + 'cut_50'] ||
            application[prefix + 'cut_70'] || application[prefix + 'notes'] ||
            application[prefix + 'url'];
        });
      } else {
        formKicker.textContent = 'NEW CARD';
        formTitle.textContent = '지원 카드 추가';
        saveButton.textContent = '카드 저장';
        resultEntrySection.open = false;
      }
      updateMinimumDetails();
      formSection.hidden = false;
      formSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function closeForm() {
      formSection.hidden = true;
      form.reset();
      editingApplicationId = '';
      formKicker.textContent = 'NEW CARD';
      formTitle.textContent = '지원 카드 추가';
      saveButton.textContent = '카드 저장';
      resultEntrySection.open = false;
      updateMinimumDetails();
    }

    function deleteApplicationFromCard(application, button) {
      const confirmed = window.confirm(
        application.university + ' ' + application.department + ' 지원 카드를 삭제할까요?\n삭제 후 학생 화면에서는 복구할 수 없습니다.'
      );
      if (!confirmed) return;

      button.disabled = true;
      button.textContent = '삭제 중…';
      google.script.run
        .withSuccessHandler(function() {
          if (editingApplicationId === application.id) closeForm();
          loadDashboard('지원 카드가 삭제되었습니다.');
        })
        .withFailureHandler(function(error) {
          button.disabled = false;
          button.textContent = '삭제';
          handleFailure(error);
        })
        .deleteApplication(token, application.id);
    }

    function updateMinimumDetails() {
      const selected = form.querySelector('[name="csat_minimum"]:checked');
      const textarea = form.elements.csat_minimum_details;
      const disabled = selected && selected.value === '없음';
      textarea.disabled = Boolean(disabled);
      if (disabled) textarea.value = '';
    }

    function showNotice(message, isError) {
      notice.textContent = message;
      notice.className = 'notice visible' + (isError ? ' error' : '');
    }

    function hideNotice() {
      notice.textContent = '';
      notice.className = 'notice';
    }

    function handleFailure(error) {
      const message = error && error.message ? error.message : '요청을 처리하지 못했습니다. 잠시 후 다시 시도해 주세요.';
      showNotice(message, true);
    }
  })();
</script>
